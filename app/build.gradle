plugins { id 'com.android.application' }
android {
 namespace 'com.picviewer.app'
 compileSdk 35
 defaultConfig { applicationId 'com.picviewer.app'; minSdk 26; targetSdk 34; versionCode 1; versionName '0.1.0'; testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'; ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64', 'x86' }; externalNativeBuild { cmake { cppFlags '-std=c++17'; arguments '-DANDROID_STL=c++_static' } } }
 ndkVersion '27.2.12479018'
 externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 buildTypes { release { minifyEnabled false } }
 packaging { resources { excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*', 'META-INF/versions/**'] } }
 testOptions { unitTests.includeAndroidResources = true }
}
dependencies {
 implementation project(':core')
 implementation 'com.hierynomus:smbj:0.13.0'
 implementation 'org.slf4j:slf4j-nop:2.0.9'
 implementation 'androidx.exifinterface:exifinterface:1.3.7'
 testImplementation 'junit:junit:4.13.2'
 testImplementation 'org.robolectric:robolectric:4.14.1'
 androidTestImplementation 'androidx.test:runner:1.6.2'
 androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.withType(Test).configureEach {
 maxHeapSize = '700m'
 maxParallelForks = 1
 systemProperty 'picviewer.screenshots', "${rootProject.projectDir}/captures"
 systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2'
}
